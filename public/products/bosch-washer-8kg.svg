<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="415" rx="145" ry="18" fill="#000000" fill-opacity="0.14" filter="blur(8px)" />

  <!-- Outer Cabinet (White Silver Finish) -->
  <rect x="140" y="40" width="220" height="360" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5" />

  <!-- AntiVibration Spiral Emboss on Side -->
  <circle cx="140" cy="245" r="50" stroke="#E2E8F0" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Control Console Panel -->
  <rect x="146" y="50" width="208" height="65" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Detergent Drawer with Bosch Logo -->
  <rect x="155" y="58" width="55" height="48" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="182" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="900" fill="#E11D48" text-anchor="middle" letter-spacing="1">BOSCH</text>
  <text x="182" y="85" font-family="sans-serif" font-size="6" font-weight="700" fill="#64748B" text-anchor="middle">Serie | 6</text>

  <!-- Rotary Selector Dial (Center) -->
  <circle cx="245" cy="82" r="22" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <circle cx="245" cy="82" r="16" fill="#FFFFFF" />
  <line x1="245" y1="64" x2="245" y2="70" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" />

  <!-- Touch LED Display (Right - Classic Bosch Red/White LED) -->
  <rect x="282" y="58" width="62" height="48" rx="3" fill="#0F172A" />
  <text x="313" y="78" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#F43F5E" text-anchor="middle">1400</text>
  <text x="313" y="90" font-family="sans-serif" font-size="6" font-weight="700" fill="#38BDF8" text-anchor="middle">ECO SILENCE</text>
  <text x="313" y="98" font-family="sans-serif" font-size="5" font-weight="600" fill="#4ADE80" text-anchor="middle">SPEED PERFECT</text>

  <!-- Front Load Tinted Glass Porch Door -->
  <circle cx="250" cy="245" r="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4" />
  <circle cx="250" cy="245" r="76" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Drum Interior Reflection -->
  <circle cx="250" cy="245" r="62" fill="url(#bosch_drum)" />
  <ellipse cx="235" cy="230" rx="42" ry="20" fill="#FFFFFF" fill-opacity="0.15" transform="rotate(-30 235 230)" />

  <!-- Chrome Door Handle -->
  <path d="M334 235C337 242 337 252 334 258" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Drain Access Door -->
  <rect x="295" y="360" width="45" height="30" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="160" y="380" font-family="sans-serif" font-size="8" font-weight="700" fill="#15803D">★★★★★ 5-STAR BEE</text>

  <defs>
    <radialGradient id="bosch_drum" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 245) rotate(90) scale(62)">
      <stop stop-color="#334155" />
      <stop offset="0.7" stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </radialGradient>
  </defs>
</svg>
