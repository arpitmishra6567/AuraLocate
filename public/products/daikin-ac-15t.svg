<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <!-- Subtle Soft Shadow -->
  <ellipse cx="250" cy="270" rx="200" ry="20" fill="#000000" fill-opacity="0.12" filter="blur(8px)" />

  <!-- AC Indoor Unit Body -->
  <rect x="50" y="90" width="400" height="150" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5" />
  
  <!-- Top Bevel Highlight -->
  <path d="M52 104C52 96.268 58.268 90 66 90H434C441.732 90 448 96.268 448 104V112H52V104Z" fill="#FFFFFF" />

  <!-- Lower Discharge Louver Grille -->
  <path d="M60 205H440V228C440 234.627 434.627 240 428 240H72C65.3726 240 60 234.627 60 228V205Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="70" y1="216" x2="430" y2="216" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="226" x2="430" y2="226" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Daikin Brand Wordmark -->
  <text x="75" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A" letter-spacing="2">DAIKIN</text>
  <text x="75" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0284C7" letter-spacing="1">INVERTER</text>

  <!-- Neo Swing / 5 Star Energy Badge -->
  <rect x="75" y="160" width="54" height="22" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
  <text x="82" y="174" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803D">★★★★★ 5-STAR</text>

  <!-- Digital Temperature Display Screen -->
  <rect x="360" y="125" width="60" height="38" rx="6" fill="#0F172A" />
  <text x="372" y="152" font-family="'JetBrains Mono', monospace, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">24</text>
  <text x="403" y="142" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8">°C</text>
  <circle cx="390" cy="172" r="3" fill="#22C55E" />
  <text x="398" y="175" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748B">ECO</text>

  <!-- Subtle Air Flow Wave Vectors -->
  <path d="M120 255C150 270 200 275 250 270C300 265 350 270 380 255" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6" />
</svg>
