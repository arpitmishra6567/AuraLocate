<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="405" rx="140" ry="24" fill="#000000" fill-opacity="0.14" filter="blur(10px)" />

  <!-- Phone Body (Natural Titanium - Contoured Edge) -->
  <rect x="160" y="38" width="180" height="344" rx="38" fill="#8B8680" stroke="#ADA8A2" stroke-width="2.5" />
  
  <!-- Back Glass (Frosted Natural Titanium) -->
  <rect x="163" y="41" width="174" height="338" rx="35" fill="url(#ip15_titanium)" />

  <!-- Raised Camera Plateau (Curved Glass Island) -->
  <rect x="172" y="52" width="102" height="102" rx="24" fill="#78736E" stroke="#ADA8A2" stroke-width="1.5" />

  <!-- Triple Lens Matrix -->
  <!-- Top Left: 48MP Main Sensor -->
  <circle cx="204" cy="84" r="18" fill="#1C1A17" stroke="#ADA8A2" stroke-width="2" />
  <circle cx="204" cy="84" r="12" fill="#090807" />
  <circle cx="204" cy="84" r="5" fill="#1E3A8A" opacity="0.8" />

  <!-- Bottom Left: 12MP 5x Tetraprism Zoom -->
  <circle cx="204" cy="122" r="18" fill="#1C1A17" stroke="#ADA8A2" stroke-width="2" />
  <circle cx="204" cy="122" r="12" fill="#090807" />
  <circle cx="204" cy="122" r="5" fill="#1E3A8A" opacity="0.8" />

  <!-- Right: 12MP Ultra-wide Sensor -->
  <circle cx="242" cy="103" r="18" fill="#1C1A17" stroke="#ADA8A2" stroke-width="2" />
  <circle cx="242" cy="103" r="12" fill="#090807" />
  <circle cx="242" cy="103" r="5" fill="#1E3A8A" opacity="0.8" />

  <!-- TrueTone Dual Flash -->
  <circle cx="242" cy="70" r="7" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
  <!-- LiDAR Scanner -->
  <circle cx="242" cy="136" r="6" fill="#1C1917" stroke="#44403C" stroke-width="1" />
  <!-- Microphone Hole -->
  <circle cx="218" cy="65" r="2" fill="#1C1917" />

  <!-- Apple Monogram Logo -->
  <g transform="translate(236, 195) scale(1.1)">
    <path d="M15.22 17.04C14.28 18.42 13.29 19.78 11.75 19.81C10.21 19.84 9.71 18.9 7.95 18.9C6.18 18.9 5.63 19.78 4.17 19.84C2.68 19.89 1.54 18.39 0.58 17.01C-1.37 14.19 -0.92 7.74 3.12 7.69C4.63 7.67 5.75 8.68 6.64 8.7C7.54 8.72 8.94 7.54 10.55 7.61C11.23 7.64 13.12 7.88 14.34 9.68C14.23 9.75 12.18 10.95 12.21 13.43C12.24 16.39 14.82 17.38 14.85 17.39C14.82 17.48 14.43 18.82 13.51 20.17" fill="#44403C" opacity="0.75" />
    <path d="M10.28 5.67C10.96 4.84 11.42 3.69 11.29 2.53C10.3 2.57 9.1 3.19 8.39 4.02C7.76 4.74 7.21 5.92 7.36 7.05C8.47 7.14 9.6 6.49 10.28 5.67Z" fill="#44403C" opacity="0.75" />
  </g>

  <!-- Left: Action Button & Volume Buttons -->
  <rect x="156" y="90" width="3" height="16" rx="1" fill="#ADA8A2" />
  <rect x="156" y="118" width="3" height="32" rx="1" fill="#ADA8A2" />
  <rect x="156" y="158" width="3" height="32" rx="1" fill="#ADA8A2" />
  <!-- Right: Side Power Button -->
  <rect x="341" y="125" width="3" height="48" rx="1" fill="#ADA8A2" />

  <defs>
    <linearGradient id="ip15_titanium" x1="163" y1="41" x2="337" y2="379" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9C9791" />
      <stop offset="0.5" stop-color="#8B8680" />
      <stop offset="1" stop-color="#736E68" />
    </linearGradient>
  </defs>
</svg>
