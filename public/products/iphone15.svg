<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="405" rx="135" ry="22" fill="#000000" fill-opacity="0.14" filter="blur(10px)" />

  <!-- Phone Body (iPhone 15 - Black Matte Finish) -->
  <rect x="165" y="40" width="170" height="340" rx="36" fill="#1C1D20" stroke="#37393E" stroke-width="2.5" />
  
  <!-- Back Glass Surface -->
  <rect x="168" y="43" width="164" height="334" rx="33" fill="url(#ip15_black)" />

  <!-- Raised Camera Island (Square Rounded) -->
  <rect x="178" y="52" width="85" height="85" rx="20" fill="#2B2D32" stroke="#3F4147" stroke-width="1.5" />

  <!-- Diagonal Dual-Camera Array -->
  <!-- Top: 48MP Main Camera -->
  <circle cx="205" cy="78" r="18" fill="#0E0F11" stroke="#3F4147" stroke-width="2" />
  <circle cx="205" cy="78" r="12" fill="#000000" />
  <circle cx="205" cy="78" r="5" fill="#1D4ED8" opacity="0.8" />

  <!-- Bottom Diagonal: 12MP Ultra-wide Camera -->
  <circle cx="236" cy="110" r="18" fill="#0E0F11" stroke="#3F4147" stroke-width="2" />
  <circle cx="236" cy="110" r="12" fill="#000000" />
  <circle cx="236" cy="110" r="5" fill="#1D4ED8" opacity="0.8" />

  <!-- TrueTone Flash & Mic -->
  <circle cx="236" cy="72" r="6" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
  <circle cx="205" cy="115" r="2.5" fill="#18181B" />

  <!-- Apple Monogram Logo -->
  <g transform="translate(237, 195) scale(1.05)">
    <path d="M15.22 17.04C14.28 18.42 13.29 19.78 11.75 19.81C10.21 19.84 9.71 18.9 7.95 18.9C6.18 18.9 5.63 19.78 4.17 19.84C2.68 19.89 1.54 18.39 0.58 17.01C-1.37 14.19 -0.92 7.74 3.12 7.69C4.63 7.67 5.75 8.68 6.64 8.7C7.54 8.72 8.94 7.54 10.55 7.61C11.23 7.64 13.12 7.88 14.34 9.68C14.23 9.75 12.18 10.95 12.21 13.43C12.24 16.39 14.82 17.38 14.85 17.39C14.82 17.48 14.43 18.82 13.51 20.17" fill="#4B4E54" />
    <path d="M10.28 5.67C10.96 4.84 11.42 3.69 11.29 2.53C10.3 2.57 9.1 3.19 8.39 4.02C7.76 4.74 7.21 5.92 7.36 7.05C8.47 7.14 9.6 6.49 10.28 5.67Z" fill="#4B4E54" />
  </g>

  <!-- Left: Ring/Silent Switch & Volume -->
  <rect x="161" y="90" width="3" height="14" rx="1" fill="#4B4E54" />
  <rect x="161" y="115" width="3" height="30" rx="1" fill="#4B4E54" />
  <rect x="161" y="152" width="3" height="30" rx="1" fill="#4B4E54" />
  <!-- Right: Side Power Button -->
  <rect x="336" y="120" width="3" height="45" rx="1" fill="#4B4E54" />

  <defs>
    <linearGradient id="ip15_black" x1="168" y1="43" x2="332" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D2F34" />
      <stop offset="0.5" stop-color="#1F2024" />
      <stop offset="1" stop-color="#141517" />
    </linearGradient>
  </defs>
</svg>
