<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <!-- Soft Base Shadow -->
  <ellipse cx="250" cy="310" rx="220" ry="16" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- OLED TV Bezel / Outer Frame (Super Narrow Bezel) -->
  <rect x="30" y="35" width="440" height="250" rx="2" fill="#09090B" stroke="#18181B" stroke-width="2" />
  
  <!-- Active 65" OLED evo Screen Display -->
  <rect x="33" y="38" width="434" height="244" fill="url(#lg_screen_grad)" />
  
  <!-- Luminescent Aurora Borealis Graphics on OLED evo panel -->
  <path d="M33 160C110 90 190 230 270 140C350 70 410 180 467 110V282H33V160Z" fill="url(#aurora_glow)" opacity="0.9" />

  <!-- Center Brushed Metal Pedestal Stand -->
  <rect x="190" y="285" width="120" height="15" rx="3" fill="#A1A1AA" stroke="#71717A" stroke-width="1.5" />
  <rect x="210" y="300" width="80" height="8" rx="2" fill="#71717A" />

  <!-- LG OLED evo Logo Badge -->
  <g transform="translate(48, 50)">
    <rect x="0" y="0" width="82" height="22" rx="3" fill="#000000" fill-opacity="0.7" stroke="#3F3F46" stroke-width="0.75" />
    <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="1">LG OLED <tspan fill="#F43F5E">evo</tspan></text>
  </g>

  <defs>
    <linearGradient id="lg_screen_grad" x1="33" y1="38" x2="467" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617" />
      <stop offset="0.6" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="aurora_glow" x1="33" y1="90" x2="467" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" />
      <stop offset="0.35" stop-color="#10B981" />
      <stop offset="0.7" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
</svg>
