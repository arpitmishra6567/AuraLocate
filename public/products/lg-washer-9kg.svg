<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="415" rx="150" ry="20" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- Washer Outer Cabinet (Black Steel Finish) -->
  <rect x="135" y="40" width="230" height="360" rx="14" fill="#27272A" stroke="#52525B" stroke-width="3" />
  
  <!-- Subtle Brushed Metal Sheen -->
  <rect x="139" y="44" width="222" height="352" rx="12" fill="url(#washer_steel)" />

  <!-- Top Control Console Panel -->
  <rect x="145" y="52" width="210" height="70" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" />
  
  <!-- Detergent Dispenser Drawer (Left) -->
  <rect x="155" y="62" width="55" height="50" rx="3" fill="#27272A" stroke="#52525B" stroke-width="1" />
  <rect x="162" y="82" width="40" height="6" rx="2" fill="#3F3F46" />
  <text x="182" y="74" font-family="sans-serif" font-size="7" font-weight="700" fill="#A1A1AA" text-anchor="middle">LG AI DD</text>

  <!-- Rotary Selector Dial (Center) -->
  <circle cx="250" cy="87" r="24" fill="#3F3F46" stroke="#A1A1AA" stroke-width="2" />
  <circle cx="250" cy="87" r="18" fill="#18181B" />
  <line x1="250" y1="67" x2="250" y2="73" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Digital Touch Display (Right) -->
  <rect x="288" y="62" width="60" height="50" rx="4" fill="#09090B" stroke="#3F3F46" stroke-width="1" />
  <text x="318" y="85" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="middle">0:39</text>
  <text x="318" y="98" font-family="sans-serif" font-size="7" font-weight="600" fill="#4ADE80" text-anchor="middle">TURBOWASH</text>
  <text x="318" y="106" font-family="sans-serif" font-size="6" font-weight="500" fill="#94A3B8" text-anchor="middle">1400 RPM</text>

  <!-- Giant Tempered Glass Tinted Door (Front Load Drum) -->
  <circle cx="250" cy="245" r="95" fill="#18181B" stroke="#71717A" stroke-width="4" />
  <circle cx="250" cy="245" r="80" fill="#09090B" stroke="#3F3F46" stroke-width="2" />
  
  <!-- Tinted Deep Blue Glass Door Reflection -->
  <circle cx="250" cy="245" r="68" fill="url(#drum_glass)" />
  <ellipse cx="230" cy="225" rx="50" ry="25" fill="#FFFFFF" fill-opacity="0.1" transform="rotate(-30 230 225)" />

  <!-- Chrome Door Handle -->
  <path d="M338 230C342 238 342 252 338 260" stroke="#E4E4E7" stroke-width="4" stroke-linecap="round" />

  <!-- Lower Drain Filter Access Door -->
  <rect x="300" y="360" width="45" height="30" rx="3" fill="#18181B" stroke="#3F3F46" stroke-width="1" />

  <!-- Inverter Direct Drive 10 Year Warranty Logo -->
  <text x="160" y="380" font-family="sans-serif" font-size="8" font-weight="700" fill="#A1A1AA">10 YEAR MOTOR WARRANTY</text>

  <defs>
    <linearGradient id="washer_steel" x1="139" y1="44" x2="361" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F3F46" />
      <stop offset="0.5" stop-color="#27272A" />
      <stop offset="1" stop-color="#18181B" />
    </linearGradient>
    <radialGradient id="drum_glass" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 245) rotate(90) scale(68)">
      <stop stop-color="#1E293B" />
      <stop offset="0.7" stop-color="#0F172A" />
      <stop offset="1" stop-color="#020617" />
    </radialGradient>
  </defs>
</svg>
