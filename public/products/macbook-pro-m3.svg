<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <!-- Soft Base Shadow -->
  <ellipse cx="250" cy="305" rx="190" ry="16" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- MacBook Screen Lid (Open Angle Display) -->
  <rect x="85" y="40" width="330" height="215" rx="10" fill="#18181B" stroke="#27272A" stroke-width="2" />
  
  <!-- Liquid Retina XDR Screen -->
  <rect x="92" y="47" width="316" height="201" rx="6" fill="#09090B" />
  
  <!-- macOS Sonoma / Sequoia Abstract Flow Gradient Background on Screen -->
  <path d="M92 160C160 110 220 220 300 130C360 80 390 140 408 110V248H92V160Z" fill="url(#mac_wallpaper)" opacity="0.9" />

  <!-- Camera Notch -->
  <path d="M236 47H264V56C264 58 262 60 260 60H240C238 60 236 58 236 56V47Z" fill="#18181B" />
  <circle cx="250" cy="53" r="2" fill="#0284C7" />

  <!-- MacBook Unibody Base Chassis (Space Black Anodized) -->
  <path d="M50 255H450L425 295H75L50 255Z" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Recessed Backlit Magic Keyboard Well -->
  <polygon points="105,258 395,258 385,278 115,278" fill="#09090B" />
  <!-- Keyboard Key Lines Simulation -->
  <line x1="110" y1="264" x2="390" y2="264" stroke="#27272A" stroke-width="2" stroke-dasharray="8 3" />
  <line x1="113" y1="271" x2="387" y2="271" stroke="#27272A" stroke-width="2" stroke-dasharray="8 3" />

  <!-- Large Force Touch Trackpad -->
  <polygon points="205,280 295,280 290,293 210,293" fill="#27272A" stroke="#3F3F46" stroke-width="1" />

  <!-- Display Open Lip Notch -->
  <rect x="235" y="255" width="30" height="3" rx="1.5" fill="#3F3F46" />

  <!-- M3 Pro Chip Feature Tag -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="58" height="18" rx="3" fill="#000000" fill-opacity="0.7" stroke="#3F3F46" stroke-width="0.75" />
    <text x="7" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#E4E4E7">M3 PRO</text>
  </g>

  <defs>
    <linearGradient id="mac_wallpaper" x1="92" y1="80" x2="408" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="0.4" stop-color="#6366F1" />
      <stop offset="0.7" stop-color="#EC4899" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
</svg>
