<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="400" rx="140" ry="24" fill="#000000" fill-opacity="0.14" filter="blur(10px)" />

  <!-- Phone Body (OnePlus 12 - Silky Black) -->
  <rect x="160" y="40" width="180" height="340" rx="32" fill="#18181B" stroke="#3F3F46" stroke-width="2.5" />
  
  <!-- Subtle Silky Texture / Light Reflection -->
  <rect x="163" y="43" width="174" height="334" rx="30" fill="url(#op_silk_gradient)" />

  <!-- Luxury Circular Camera Dial Island (Flows into Frame) -->
  <path d="M158 110C158 110 180 110 195 105C220 95 270 95 295 120C320 145 320 195 295 220C270 245 220 245 195 235C180 230 158 230 158 230" fill="#27272A" stroke="#52525B" stroke-width="1.5" />
  <circle cx="245" cy="170" r="54" fill="#18181B" stroke="#71717A" stroke-width="2" />
  
  <!-- Fluted Outer Watch Ring -->
  <circle cx="245" cy="170" r="51" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Quad Sensor Matrix -->
  <!-- 1. 50MP Sony LYT-808 Main -->
  <circle cx="225" cy="150" r="14" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
  <circle cx="225" cy="150" r="6" fill="#1E293B" />
  <circle cx="225" cy="150" r="2.5" fill="#38BDF8" opacity="0.8" />

  <!-- 2. 64MP 3x Periscope Telephoto -->
  <circle cx="265" cy="150" r="14" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
  <rect x="259" y="144" width="12" height="12" rx="3" fill="#1E293B" />

  <!-- 3. 48MP Ultra-wide -->
  <circle cx="225" cy="190" r="14" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
  <circle cx="225" cy="190" r="6" fill="#1E293B" />

  <!-- 4. Hasselblad 'H' Insignia -->
  <circle cx="265" cy="190" r="14" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
  <text x="260" y="195" font-family="'Times New Roman', serif" font-size="14" font-weight="800" font-style="italic" fill="#E4E4E7">H</text>

  <!-- Dual LED Flash Unit (Outside Island) -->
  <circle cx="190" cy="95" r="4.5" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />

  <!-- OnePlus 1+ Logo -->
  <g transform="translate(236, 280) scale(1.1)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="none" stroke="#71717A" stroke-width="2" />
    <text x="5" y="17" font-family="sans-serif" font-size="15" font-weight="900" fill="#71717A">1</text>
    <path d="M15 7H19M17 5V9" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Left Alert Slider & Right Power Button -->
  <rect x="156" y="110" width="3" height="24" rx="1" fill="#71717A" />
  <rect x="341" y="130" width="3" height="36" rx="1" fill="#71717A" />

  <defs>
    <linearGradient id="op_silk_gradient" x1="163" y1="43" x2="337" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272A" />
      <stop offset="0.4" stop-color="#18181B" />
      <stop offset="1" stop-color="#09090B" />
    </linearGradient>
  </defs>
</svg>
