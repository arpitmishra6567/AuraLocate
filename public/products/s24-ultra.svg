<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="405" rx="145" ry="22" fill="#000000" fill-opacity="0.16" filter="blur(10px)" />

  <!-- Phone Body (S24 Ultra - Sharp Squared Titanium Frame) -->
  <rect x="155" y="35" width="190" height="350" rx="8" fill="#4B4E54" stroke="#71757E" stroke-width="2.5" />
  
  <!-- Back Glass (Titanium Gray Matte) -->
  <rect x="159" y="39" width="182" height="342" rx="6" fill="url(#s24_gradient)" />

  <!-- Floating Camera Ring Matrix (Iconic Samsung Linear Layout) -->
  <!-- 1. 200MP Main Primary Lens -->
  <circle cx="195" cy="85" r="19" fill="#1C1D20" stroke="#71757E" stroke-width="2" />
  <circle cx="195" cy="85" r="12" fill="#0A0A0C" />
  <circle cx="195" cy="85" r="5" fill="#3B82F6" opacity="0.7" />

  <!-- 2. 12MP Ultra-wide Lens -->
  <circle cx="195" cy="135" r="19" fill="#1C1D20" stroke="#71757E" stroke-width="2" />
  <circle cx="195" cy="135" r="12" fill="#0A0A0C" />
  <circle cx="195" cy="135" r="5" fill="#3B82F6" opacity="0.7" />

  <!-- 3. 50MP 5x Periscope Telephoto Lens -->
  <circle cx="195" cy="185" r="19" fill="#1C1D20" stroke="#71757E" stroke-width="2" />
  <circle cx="195" cy="185" r="12" fill="#0A0A0C" />
  <rect x="190" y="180" width="10" height="10" rx="2" fill="#1E293B" />

  <!-- Right Sensor Column -->
  <!-- LED Flash -->
  <circle cx="242" cy="75" r="6" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
  <!-- Laser Auto-Focus Sensor -->
  <circle cx="242" cy="105" r="11" fill="#1C1D20" stroke="#71757E" stroke-width="1.5" />
  <circle cx="242" cy="105" r="6" fill="#0A0A0C" />
  <!-- 10MP 3x Telephoto Lens -->
  <circle cx="242" cy="140" r="14" fill="#1C1D20" stroke="#71757E" stroke-width="1.5" />
  <circle cx="242" cy="140" r="8" fill="#0A0A0C" />

  <!-- Samsung Logo -->
  <text x="250" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8F949F" text-anchor="middle" letter-spacing="4">SAMSUNG</text>

  <!-- Side Titanium Flat Buttons -->
  <rect x="345" y="110" width="3" height="40" rx="1" fill="#71757E" />
  <rect x="345" y="165" width="3" height="25" rx="1" fill="#71757E" />

  <!-- S-Pen Bottom Cap Hint -->
  <rect x="170" y="385" width="16" height="3" rx="1" fill="#2E3034" />

  <defs>
    <linearGradient id="s24_gradient" x1="159" y1="39" x2="341" y2="381" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5F626A" />
      <stop offset="0.5" stop-color="#4B4E54" />
      <stop offset="1" stop-color="#3A3C41" />
    </linearGradient>
  </defs>
</svg>
