<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="420" rx="130" ry="18" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- Refrigerator Body Cabinet (Double Door) -->
  <rect x="160" y="30" width="180" height="380" rx="8" fill="#52525B" stroke="#71717A" stroke-width="2.5" />
  
  <!-- Metallic Brushed Steel Surface -->
  <rect x="163" y="33" width="174" height="374" rx="6" fill="url(#fridge_steel)" />

  <!-- Upper Freezer Door -->
  <rect x="165" y="35" width="170" height="110" rx="4" fill="#3F3F46" stroke="#52525B" stroke-width="1.5" />
  <rect x="167" y="37" width="166" height="106" rx="3" fill="url(#door_gradient)" />
  
  <!-- Samsung Logo on Top Door -->
  <text x="250" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#E4E4E7" text-anchor="middle" letter-spacing="2">SAMSUNG</text>
  <text x="250" y="72" font-family="sans-serif" font-size="7" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1">TWIN COOLING PLUS</text>

  <!-- Digital Inverter 20-Year Warranty Badge -->
  <rect x="290" y="85" width="36" height="42" rx="3" fill="#18181B" stroke="#71717A" stroke-width="1" />
  <text x="308" y="100" font-family="sans-serif" font-size="6" font-weight="700" fill="#38BDF8" text-anchor="middle">20 YEAR</text>
  <text x="308" y="110" font-family="sans-serif" font-size="5" font-weight="600" fill="#E4E4E7" text-anchor="middle">WARRANTY</text>
  <text x="308" y="120" font-family="sans-serif" font-size="4" font-weight="500" fill="#94A3B8" text-anchor="middle">COMPRESSOR</text>

  <!-- Middle Recessed Pocket Handle Separator -->
  <rect x="163" y="146" width="174" height="8" fill="#18181B" />
  <rect x="220" y="147" width="60" height="6" rx="2" fill="#09090B" />

  <!-- Lower Fresh Food Refrigerator Door -->
  <rect x="165" y="155" width="170" height="250" rx="4" fill="#3F3F46" stroke="#52525B" stroke-width="1.5" />
  <rect x="167" y="157" width="166" height="246" rx="3" fill="url(#door_gradient)" />

  <!-- Convertible 5-in-1 Feature Badge -->
  <g transform="translate(180, 180)">
    <rect x="0" y="0" width="68" height="18" rx="3" fill="#1E293B" stroke="#38BDF8" stroke-width="0.75" />
    <text x="34" y="12" font-family="sans-serif" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle">5-in-1 CONVERTIBLE</text>
  </g>

  <!-- BEE 3-Star Energy Rating Sticker -->
  <rect x="180" y="210" width="40" height="24" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
  <text x="200" y="222" font-family="sans-serif" font-size="6" font-weight="800" fill="#15803D" text-anchor="middle">★★★☆☆</text>
  <text x="200" y="230" font-family="sans-serif" font-size="5" font-weight="700" fill="#166534" text-anchor="middle">ENERGY SAVER</text>

  <!-- Bottom Base Plate & Leveling Feet -->
  <rect x="175" y="408" width="20" height="6" rx="1" fill="#27272A" />
  <rect x="305" y="408" width="20" height="6" rx="1" fill="#27272A" />

  <defs>
    <linearGradient id="fridge_steel" x1="163" y1="33" x2="337" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71717A" />
      <stop offset="0.5" stop-color="#52525B" />
      <stop offset="1" stop-color="#3F3F46" />
    </linearGradient>
    <linearGradient id="door_gradient" x1="167" y1="37" x2="333" y2="403" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52525B" />
      <stop offset="0.3" stop-color="#71717A" />
      <stop offset="0.7" stop-color="#52525B" />
      <stop offset="1" stop-color="#3F3F46" />
    </linearGradient>
  </defs>
</svg>
