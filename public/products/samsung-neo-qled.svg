<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <!-- Soft Base Shadow -->
  <ellipse cx="250" cy="305" rx="210" ry="16" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- Neo QLED Narrow Titanium Bezel -->
  <rect x="35" y="40" width="430" height="240" rx="3" fill="#18181B" stroke="#3F3F46" stroke-width="2" />
  
  <!-- Active Mini-LED Quantum Matrix Screen -->
  <rect x="38" y="43" width="424" height="234" rx="1" fill="url(#neo_qled_grad)" />
  
  <!-- Vivid High-Dynamic-Range Visuals on Screen -->
  <circle cx="250" cy="145" r="55" fill="url(#quantum_dot_burst)" opacity="0.9" />
  <path d="M38 210C130 170 210 240 290 190C370 140 420 180 462 170V277H38V210Z" fill="url(#ocean_depth)" opacity="0.8" />

  <!-- Samsung Micro Brandmark on Lower Bezel -->
  <text x="250" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6" font-weight="700" fill="#A1A1AA" text-anchor="middle" letter-spacing="2">SAMSUNG</text>

  <!-- Center Floating Plate Stand -->
  <polygon points="215,280 285,280 295,302 205,302" fill="#52525B" stroke="#71717A" stroke-width="1.5" />
  <rect x="246" y="280" width="8" height="15" fill="#3F3F46" />

  <!-- Neo QLED 4K Badge -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="75" height="18" rx="2" fill="#000000" fill-opacity="0.75" stroke="#38BDF8" stroke-width="0.75" />
    <text x="8" y="12" font-family="sans-serif" font-size="8" font-weight="800" fill="#38BDF8">Neo QLED 4K</text>
  </g>

  <defs>
    <linearGradient id="neo_qled_grad" x1="38" y1="43" x2="462" y2="277" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617" />
      <stop offset="0.6" stop-color="#0F172A" />
      <stop offset="1" stop-color="#0B1329" />
    </linearGradient>
    <radialGradient id="quantum_dot_burst" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 145) rotate(90) scale(55)">
      <stop stop-color="#F59E0B" />
      <stop offset="0.4" stop-color="#EF4444" />
      <stop offset="0.8" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ocean_depth" x1="38" y1="140" x2="462" y2="277" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" />
      <stop offset="0.5" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
  </defs>
</svg>
