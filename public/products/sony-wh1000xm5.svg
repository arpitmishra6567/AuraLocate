<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Soft Base Shadow -->
  <ellipse cx="250" cy="405" rx="140" ry="18" fill="#000000" fill-opacity="0.14" filter="blur(8px)" />

  <!-- Ultra-Comfort Slim Padded Headband -->
  <path d="M150 250C150 140 200 70 250 70C300 70 350 140 350 250" stroke="#18181B" stroke-width="18" stroke-linecap="round" />
  <path d="M155 250C155 145 200 78 250 78C300 78 345 145 345 250" stroke="#27272A" stroke-width="8" stroke-linecap="round" />

  <!-- Stepless Slider Metal Extenders -->
  <rect x="145" y="210" width="10" height="40" rx="3" fill="#3F3F46" />
  <rect x="345" y="210" width="10" height="40" rx="3" fill="#3F3F46" />

  <!-- Left Angled Earcup (Soft Fit Synthetic Leather) -->
  <g transform="translate(110, 230) rotate(-10 40 50)">
    <!-- Swivel Yoke -->
    <path d="M35 10V25" stroke="#3F3F46" stroke-width="6" stroke-linecap="round" />
    <!-- Outer Cup -->
    <ellipse cx="40" cy="65" rx="35" ry="50" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <ellipse cx="40" cy="65" rx="28" ry="42" fill="#09090B" />
    <!-- Gold SONY Logo on Left Hinge -->
    <text x="35" y="32" font-family="'Times New Roman', serif" font-size="6" font-weight="700" fill="#D4AF37" text-anchor="middle">SONY</text>
  </g>

  <!-- Right Angled Earcup (Touch Control Surface) -->
  <g transform="translate(310, 230) rotate(10 40 50)">
    <!-- Swivel Yoke -->
    <path d="M45 10V25" stroke="#3F3F46" stroke-width="6" stroke-linecap="round" />
    <!-- Outer Cup -->
    <ellipse cx="40" cy="65" rx="35" ry="50" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <ellipse cx="40" cy="65" rx="28" ry="42" fill="#09090B" />
    <!-- Gold SONY Logo on Right Hinge -->
    <text x="45" y="32" font-family="'Times New Roman', serif" font-size="6" font-weight="700" fill="#D4AF37" text-anchor="middle">SONY</text>
  </g>

  <!-- Active Noise Cancelling Badge -->
  <g transform="translate(200, 220)">
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#18181B" stroke="#D4AF37" stroke-width="1" />
    <text x="50" y="16" font-family="sans-serif" font-size="8" font-weight="700" fill="#D4AF37" text-anchor="middle">INDUSTRY LEADING ANC</text>
  </g>
</svg>
