<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <!-- Drop Shadow -->
  <ellipse cx="250" cy="420" rx="125" ry="18" fill="#000000" fill-opacity="0.16" filter="blur(8px)" />

  <!-- Refrigerator Body Cabinet -->
  <rect x="165" y="30" width="170" height="380" rx="6" fill="#4B5563" stroke="#6B7280" stroke-width="2.5" />
  
  <!-- Metallic Titanium Finish -->
  <rect x="168" y="33" width="164" height="374" rx="4" fill="url(#whirlpool_steel)" />

  <!-- Upper Freezer Door -->
  <rect x="170" y="35" width="160" height="110" rx="3" fill="#374151" stroke="#4B5563" stroke-width="1.5" />
  <rect x="172" y="37" width="156" height="106" rx="2" fill="url(#wp_door)" />
  
  <!-- Whirlpool Brand Logo with Wave Swirl -->
  <g transform="translate(210, 52)">
    <ellipse cx="40" cy="12" rx="35" ry="10" stroke="#F59E0B" stroke-width="1.25" fill="none" opacity="0.8" />
    <text x="40" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle">Whirlpool</text>
  </g>
  <text x="250" y="80" font-family="sans-serif" font-size="6" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">INTELLIFRESH 6TH SENSE</text>

  <!-- Middle Recessed Pocket Handle -->
  <rect x="168" y="146" width="164" height="8" fill="#1F2937" />
  <rect x="220" y="147" width="60" height="6" rx="2" fill="#111827" />

  <!-- Lower Fresh Food Refrigerator Door -->
  <rect x="170" y="155" width="160" height="250" rx="3" fill="#374151" stroke="#4B5563" stroke-width="1.5" />
  <rect x="172" y="157" width="156" height="246" rx="2" fill="url(#wp_door)" />

  <!-- Microblock & Zeolite Freshness Badge -->
  <g transform="translate(185, 175)">
    <rect x="0" y="0" width="70" height="18" rx="3" fill="#047857" fill-opacity="0.2" stroke="#10B981" stroke-width="0.75" />
    <text x="35" y="12" font-family="sans-serif" font-size="6" font-weight="700" fill="#10B981" text-anchor="middle">15 DAYS GARDEN FRESH</text>
  </g>

  <!-- 10 Year Compressor Warranty Badge -->
  <rect x="285" y="175" width="35" height="40" rx="2" fill="#111827" stroke="#374151" stroke-width="1" />
  <text x="302" y="190" font-family="sans-serif" font-size="6" font-weight="700" fill="#F59E0B" text-anchor="middle">10 YEAR</text>
  <text x="302" y="198" font-family="sans-serif" font-size="5" font-weight="600" fill="#FFFFFF" text-anchor="middle">WARRANTY</text>

  <!-- Leveling Feet -->
  <rect x="180" y="408" width="18" height="6" rx="1" fill="#1F2937" />
  <rect x="302" y="408" width="18" height="6" rx="1" fill="#1F2937" />

  <defs>
    <linearGradient id="whirlpool_steel" x1="168" y1="33" x2="332" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B7280" />
      <stop offset="0.5" stop-color="#4B5563" />
      <stop offset="1" stop-color="#374151" />
    </linearGradient>
    <linearGradient id="wp_door" x1="172" y1="37" x2="328" y2="403" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5563" />
      <stop offset="0.3" stop-color="#6B7280" />
      <stop offset="0.7" stop-color="#4B5563" />
      <stop offset="1" stop-color="#374151" />
    </linearGradient>
  </defs>
</svg>
